name: Install MCU PDF Reader site (bootstrap)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.bootstrap/site.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand and check site sources
        run: |
          set -euo pipefail
          base64 -d .bootstrap/site.tar.xz.b64 | xz -d | tar -xf -
          node --check site/app.js
          python scripts/import_manuals.py --verify-only
      - name: Commit website without modifying workflow files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap
          git add -A .bootstrap
          git add README.md source-manuals.tsv scripts/import_manuals.py site
          git commit -m "Create PDF reader with indexed manuals and import tool"
          git push origin HEAD:main
