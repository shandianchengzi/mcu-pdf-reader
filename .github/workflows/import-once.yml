name: One-time copy of LibAFL Emulator PDFs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-pdf-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check source repository access
        env:
          SOURCE_TOKEN: ${{ secrets.MANUALS_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo '::error::Set MANUALS_SOURCE_TOKEN to a fine-grained GitHub token with Contents:Read permission on IoTS-P/LibAFL-Emulator.'
            exit 1
          fi
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: dest
          persist-credentials: true
      - name: Checkout original manuals from private source repository
        uses: actions/checkout@v4
        with:
          repository: IoTS-P/LibAFL-Emulator
          ref: gemu-v2
          token: ${{ secrets.MANUALS_SOURCE_TOKEN }}
          path: source
          sparse-checkout: |
            rule_generator/Manuals
          persist-credentials: false
      - name: Copy PDFs and verify exact original Git blob hashes
        run: |
          python dest/scripts/import_manuals.py --source source --target dest/site
          cd dest
          python scripts/import_manuals.py --verify-only
      - name: Commit all PDFs to this repository (single import)
        working-directory: dest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/manuals.json site/pdfs
          if git diff --cached --quiet; then
            echo 'All PDFs were already copied; no changes.'
            exit 0
          fi
          git commit -m 'Copy MCU reference manual PDFs from LibAFL-Emulator gemu-v2'
          git push origin HEAD:main